/* ===== Design tokens ===== */
:root{--bg:#0a0a0c;--s1:#101013;--s2:#17171b;--s3:#202026;--bd:#26262d;--tx:#ececef;--tx2:#9b9ba6;--tx3:#6d6d78;--ac:#8b9cff;--ac-tx:#0a0a0c;--danger:#ff6b6b;--ok:#5ad19a;

[data-theme=light]{--bg:#f7f7f9;--s1:#fff;--s2:#f0f0f4;--s3:#e5e5ec;--bd:#dcdce4;--tx:#15151a;--tx2:#5c5c68;--tx3:#8a8a96;--sh:0 20px 60px rgba(20,20,40,.15);color-scheme:light}
[data-hc=on]{--bd:#6d6d78;--tx2:var(--tx);--tx3:var(--tx2)}
[data-density=compact]{--pad:10px}
[data-motion=reduced] *{animation-duration:.001s!important;transition-duration:.001s!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:var(--fs)/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background var(--dur),color var(--dur)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:8px;border:3px solid transparent;background-clip:content-box}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);transition:background var(--dur),color var(--dur),transform .1s}
.ib:hover{background:var(--s2);color:var(--tx)}.ib:active,.btn:active{transform:scale(.95)}
.btn{padding:9px 14px;border-radius:10px;background:var(--s2);border:1px solid var(--bd);transition:background var(--dur),transform .1s;font-size:.875rem}
.btn:hover{background:var(--s3)}.btn.pri{background:var(--ac);color:var(--ac-tx);border-color:transparent;font-weight:600}.btn.dng{color:var(--danger)}
/* ===== Shell ===== */
#app{display:flex;height:var(--app-h);width:100%;position:relative;overflow:hidden}
#side{width:var(--sw);background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex:none;transition:margin var(--dur) var(--ease),transform var(--dur) var(--ease);z-index:30}

.mark svg{width:15px;height:15px;stroke-width:2.2}.mark{overflow:hidden}.mark img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.sidetop{padding:8px 12px;display:grid;gap:8px}

.col{max-width:var(--mw);margin:0 auto;padding:0 var(--pad)}
/* welcome */

.card{text-align:left;padding:14px 16px;border-radius:var(--r);background:var(--s1);border:1px solid var(--bd);transition:transform var(--dur) var(--ease),border-color var(--dur),background var(--dur)}

.msg.ai .who{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--tx2);margin-bottom:6px}.msg.ai .mark{width:20px;height:20px;border-radius:6px}.msg.ai .mark svg{width:11px;height:11px}
.prose{overflow-wrap:anywhere}.prose>*+*{margin-top:.8em}
.prose h2,.prose h3,.prose h4{letter-spacing:-.01em;line-height:1.3}.prose h2{font-size:1.3em}.prose h3{font-size:1.15em}

.prose a{color:var(--ac);text-underline-offset:3px}

.code{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--s1)}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:var(--s2);font:.75rem var(--mono);color:var(--tx2)}
.code-h button{padding:3px 9px;border-radius:7px;color:var(--tx2)}.code-h button:hover{background:var(--s3);color:var(--tx)}
.code pre{padding:14px;overflow:auto;font:.85rem/1.6 var(--mono)}.code pre code{background:none;padding:0}
.acts{display:flex;gap:2px;margin-top:6px;opacity:0;transition:opacity var(--dur);flex-wrap:wrap}.msg.user .acts{justify-content:flex-end}
.msg:hover .acts,.msg:focus-within .acts,[data-input=touch] .acts{opacity:1}[data-actions=off] .acts{display:none}
.acts button{font-size:.78rem;color:var(--tx3);padding:4px 9px;border-radius:8px}.acts button:hover{background:var(--s2);color:var(--tx)}
.ts{font-size:.72rem;color:var(--tx3);margin-top:4px}[data-ts=off] .ts{display:none}.msg.user .ts{text-align:right}
.dots{display:inline-flex;gap:5px;padding:8px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--tx3);animation:bl 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

.caret::after{content:"";display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-.15em;background:var(--ac);animation:bl 1s infinite}
/* composer */
#err{display:none;margin:0 auto 8px;max-width:var(--mw);width:calc(100% - 2*var(--pad));padding:10px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--danger) 50%,transparent);background:color-mix(in srgb,var(--danger) 10%,var(--s1));font-size:.875rem;gap:12px;align-items:center;justify-content:space-between;animation:up .25s var(--ease)}
#err.on{display:flex}

.box{max-width:var(--mw);margin:0 auto;display:flex;align-items:flex-end;gap:6px;background:var(--s1);border:1px solid var(--bd);border-radius:calc(var(--r) + 8px);padding:8px 8px 8px 16px;transition:border-color var(--dur),box-shadow var(--dur)}
.box:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 14%,transparent)}
#in{flex:1;background:none;border:0;outline:0;resize:none;max-height:200px;padding:7px 0;line-height:1.5}

.hint{max-width:var(--mw);margin:6px auto 0;text-align:center;font-size:.72rem;color:var(--tx3)}
[hidden]{display:none!important}
.box{flex-direction:column;align-items:stretch;gap:2px;padding:8px 8px 6px 16px}
.box.drop{border-style:dashed;border-color:var(--ac)}
.tools{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}

.tr{flex:none;margin-left:auto;display:flex;align-items:center;gap:6px}
.tr .ib.tool{width:34px;height:34px}
#send{width:36px;height:36px;border-radius:11px;box-shadow:0 1px 0 color-mix(in srgb,#fff 18%,transparent) inset}

.tb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9px;color:var(--tx2);font-size:.82rem;transition:background var(--dur),color var(--dur),transform .1s}
.tb:hover{background:var(--s2);color:var(--tx)}.tb:active{transform:scale(.96)}

.tb.think:hover{border-color:color-mix(in srgb,var(--tx3) 55%,transparent);color:var(--tx);background:var(--s2)}
.tb.think svg{width:15px;height:15px;transition:transform .3s var(--ease)}
.tb.think.on{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 50%,transparent);background:color-mix(in srgb,var(--ac) 13%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 6%,transparent)}
.tb.think.on svg{transform:rotate(-8deg) scale(1.06)}
.tb.think:active{transform:scale(.97)}
#tTemp.on{color:var(--ac)}
.tb.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.tb svg{width:16px;height:16px}
#mic.on{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.rec{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:.8rem;color:var(--tx2)}
.rec i{width:3px;height:12px;border-radius:2px;background:var(--danger);animation:wv 1s ease-in-out infinite;transform-origin:center}
.rec i:nth-child(2){animation-delay:.12s}.rec i:nth-child(3){animation-delay:.24s}.rec i:nth-child(4){animation-delay:.36s}.rec i:nth-child(5){animation-delay:.48s}

.chips{display:flex;gap:8px;overflow-x:auto;max-width:var(--mw);margin:0 auto 8px;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

.chip button:hover{background:var(--s2);color:var(--tx)}.chip svg{width:14px;height:14px}

.sm input{width:100%;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);margin-bottom:14px;outline:0}.sm input:focus{border-color:var(--ac)}
.row-e{display:flex;gap:8px;justify-content:flex-end}
#set{width:min(920px,100%);height:min(640px,100%);display:flex;overflow:hidden}

.sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin:18px 0 4px}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--bd)}
.set .d{font-size:.8rem;color:var(--tx3);margin-top:2px}.set>div:first-child{min-width:0}.set.col2{flex-direction:column;align-items:stretch}
.set select,.set input[type=text],.set textarea{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:7px 10px;outline:0;max-width:100%}

/* ===== Device shells ===== */
[data-device=desktop] #open{display:none}
[data-device=desktop]:not(.x) #app.collapsed #open{display:grid}
[data-device=tablet] #side,[data-device=mobile] #side{position:fixed;inset:0 auto 0 0;transform:translateX(-102%);box-shadow:var(--sh);margin:0!important;padding-top:env(safe-area-inset-top)}

/* ===== Premium overall theme: deeper neutrals, warmer light, champagne accent ===== */
[data-theme=dark]{--bg:#070709;--s1:#0d0d10;--s2:#15151a;--s3:#1d1d24;--bd:#24242c;--tx:#f2f1ee;--tx2:#a5a4a0;--tx3:#70706b;--sh:0 30px 80px -20px rgba(0,0,0,.75)}
[data-theme=light]{--bg:#f6f4f0;--s1:#fcfbf9;--s2:#f0ede8;--s3:#e6e2db;--bd:#e0dbd3;--tx:#1b1a18;--tx2:#5f5c56;--tx3:#8f8b83;--sh:0 30px 80px -24px rgba(40,34,24,.22)}
html,body{background:var(--bg)}
main[data-bg=glow] main::before{background:radial-gradient(60% 38% at 50% -8%,color-mix(in srgb,var(--ac) 9%,transparent),transparent)}
.mark{background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 92%,#fff 8%),color-mix(in srgb,var(--ac) 55%,#000))}

/* ===== MahiCloud refinement pass: precise motion + clearer composer controls ===== */
:root{--motion-fast:140ms;--motion-mid:220ms;--motion-slow:340ms;--ease-premium:cubic-bezier(.22,.72,.18,1)}
@media (prefers-reduced-motion:no-preference){
  #side{transition:transform var(--motion-slow) var(--ease-premium),margin var(--motion-slow) var(--ease-premium)}
  #scrim{transition:opacity var(--motion-slow) var(--ease-premium)}
  #top{transition:background var(--motion-mid) ease,border-color var(--motion-mid) ease}
  .msg{animation:message-arrive 420ms var(--ease-premium) both}
  .chip{animation:chip-arrive 280ms var(--ease-premium) both}
  .card{transition:transform 280ms var(--ease-premium),border-color 280ms ease,background 280ms ease,box-shadow 280ms ease}
  .ib,.tb,.btn{transition:background 200ms ease,color 200ms ease,border-color 200ms ease,box-shadow 240ms ease,transform 140ms var(--ease-premium)}
  .box{transition:border-color 260ms ease,box-shadow 260ms ease,background 260ms ease}
  .ov.on .dlg{animation:dialog-arrive 320ms var(--ease-premium) both}
  .menu{animation:menu-arrive 180ms var(--ease-premium) both;transform-origin:top left}
  .toast{animation:toast-arrive 280ms var(--ease-premium) both}
  #tTemp.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 16%,transparent)}
}
@keyframes message-arrive{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes chip-arrive{from{opacity:0;transform:translateY(5px) scale(.985)}to{opacity:1;transform:none}}
@keyframes dialog-arrive{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes menu-arrive{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:none}}
@keyframes toast-arrive{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ===== Premium motion pass: cohesive, subtle and GPU-friendly transitions ===== */
:root{
  --motion-fast:160ms;
  --motion-base:240ms;
  --motion-slow:340ms;
  --ease-smooth:cubic-bezier(.22,.75,.18,1);

}

#side{

<script>
"use strict";
/* ===== 1. Backend adapter (existing MahiCloud contracts; public config only, no secrets) ===== */
const CFG = Object.assign({
  supabaseUrl: "https://husydmiujigyonlxbuuj.supabase.co",
  supabasePublishableKey: "sb_publishable_zzAitNIGOutgaS5EGZKfrQ_osRrlu8U"
}, window.MAHI_AI_CONFIG || {});
const SESSION_KEY = "sb-" + new URL(CFG.supabaseUrl).hostname.split(".")[0] + "-auth-token"; // same key supabase-js uses
const baseHeaders = { apikey: CFG.supabasePublishableKey, "Content-Type": "application/json" };
const Api = {
  sess: null,
  async ensure() {
    let s = this.sess;
    if (!s) { try { s = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (_) { s = null; } }
    const now = Date.now() / 1000;
    if (s && s.access_token && (s.expires_at || 0) > now + 60) return (this.sess = s);
    let r;
    if (s && s.refresh_token) r = await fetch(CFG.supabaseUrl + "/auth/v1/token?grant_type=refresh_token", { method: "POST", headers: baseHeaders, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    if (!r || !r.ok) r = await fetch(CFG.supabaseUrl + "/auth/v1/signup", { method: "POST", headers: baseHeaders, body: JSON.stringify({ data: {} }) }); // anonymous guest session
    if (!r.ok) throw new Error("auth");
    s = await r.json();
    s.expires_at = s.expires_at || Math.floor(now) + (s.expires_in || 3600);
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (_) {}
    return (this.sess = s);
  },
  async rest(path, o = {}) {
    const s = await this.ensure();
    const r = await fetch(CFG.supabaseUrl + "/rest/v1/" + path, { ...o, headers: { ...baseHeaders, Authorization: "Bearer " + s.access_token, ...(o.headers || {}) } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.status === 204 ? null : r.json().catch(() => null);
  },
  conversations: () => Api.rest("mahi_ai_conversations?select=id,title,updated_at&order=updated_at.desc&limit=50"),
  messages: id => Api.rest("mahi_ai_messages?select=id,role,content,created_at&conversation_id=eq." + id + "&order=created_at.desc&limit=200").then(d => (d || []).reverse()),
  searchMessages: q => Api.rest("mahi_ai_messages?select=conversation_id&content=ilike." + encodeURIComponent("*" + q.replace(/[*,()]/g, " ") + "*") + "&limit=300"),
  rename: (id, title) => Api.rest("mahi_ai_conversations?id=eq." + id, { method: "PATCH", body: JSON.stringify({ title }), headers: { Prefer: "return=minimal" } }),
  remove: id => Api.rest("mahi_ai_conversations?id=eq." + id, { method: "DELETE", headers: { Prefer: "return=minimal" } }),
  async chat(body, signal) {
    const s = await this.ensure();
    return fetch(CFG.supabaseUrl + "/functions/v1/mahi-ai-chat", { method: "POST", signal, headers: { ...baseHeaders, Authorization: "Bearer " + s.access_token }, body: JSON.stringify(body) });
  }
};

/* ===== 2. Helpers ===== */
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clean = t => String(t || "").replace(/^\[\[MAHI_REPLY_TO:[\s\S]*?\[\[\/MAHI_REPLY_TO\]\]\n\n/, "").replace(/\s*\[\[MAHI_LANG:[\s\S]*$/i, "").replace(/!\[[^\]]*\]\(mahi-storage:\/\/[^)]+\)/g, "[image stored in this chat]");
function toast(m) { const t = el("div", "toast", m); $("#toasts").append(t); setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, 2200); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied"); } catch (_) { const a = el("textarea"); a.value = text; document.body.append(a); a.select(); try { document.execCommand("copy"); toast("Copied"); } catch (_) { toast("Copy failed"); } a.remove(); } }

/* safe markdown: everything is escaped first, only whitelisted tags are produced */
function md(src) {
  const blocks = [];
  src = String(src).replace(/```([\w+-]*)\n([\s\S]*?)(```|$)/g, (m, l, c) => { blocks.push('<div class="code"><div class="code-h"><span>' + esc(l || "code") + '</span><button type="button" data-copy>Copy</button></div><pre><code>' + esc(c.replace(/\n$/, "")) + "</code></pre></div>"); return "\n\u0000" + (blocks.length - 1) + "\u0000\n"; });
  const inl = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  let out = "", list = null, para = [];
  const flushP = () => { if (para.length) out += "<p>" + para.map(inl).join("<br>") + "</p>"; para = []; };
  const flushL = () => { if (list) out += "</" + list + ">"; list = null; };

function renderSettings() {

name: Clean abandoned archive staging
on:
  push:
    branches: [main]
    paths:
      - ".sync-payload/**"
      - ".github/workflows/sync-upload.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only the failed temporary staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync-payload
          rm -f .github/workflows/sync-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove failed temporary archive staging"
          git push origin HEAD:main

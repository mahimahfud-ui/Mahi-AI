name: Deploy Mahi-AI Edge Function

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-mahi-ai-edge.yml"
      - "supabase/functions/mahi-ai-chat/**"
  workflow_dispatch:

permissions:
  contents: read

# Serialize production deploys. A later main-branch run waits and deploys main.
concurrency:
  group: mahi-ai-chat-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Never deploy a feature branch through a manually dispatched workflow.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Deploy mahi-ai-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing Supabase deploy secret::Add the repository Actions secret SUPABASE_ACCESS_TOKEN before deploying."
            exit 1
          fi
          supabase functions deploy mahi-ai-chat --project-ref husydmiujigyonlxbuuj --yes

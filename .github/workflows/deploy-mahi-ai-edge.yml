name: Deploy Mahi-AI Edge Function

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-mahi-ai-edge.yml"
      - "supabase/functions/mahi-ai-chat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy mahi-ai-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing repository secret SUPABASE_ACCESS_TOKEN; Edge Function was not deployed."
            exit 1
          fi
          supabase functions deploy mahi-ai-chat --project-ref husydmiujigyonlxbuuj

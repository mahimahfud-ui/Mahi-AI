name: Temporary one-time MahiCloud cybersecurity guidance patch
on:
  push:
    paths:
      - ".github/workflows/patch-mahi-cybersecurity-guidance-once.yml"
permissions:
  contents: write
jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply the two exact text edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "supabase/functions/mahi-ai-chat/index.ts";
          let source = fs.readFileSync(path, "utf8");
          const count = (text, needle) => text.split(needle).length - 1;
          const start = source.indexOf('const unlockedGuidance = "');
          const end = source.indexOf('";', start);
          if (start < 0 || end < 0) throw new Error("Could not locate the unlockedGuidance declaration.");
          const oldDeclaration = source.slice(start, end + 2);
          if (oldDeclaration.includes("CYBERSECURITY-AWARE MODE")) {
            console.log("Cybersecurity guidance already present.");
          } else {
            const newDeclaration = 'const unlockedGuidance = "USER-FRIENDLY, CYBERSECURITY-AWARE MODE: You are MahiCloud. Answer the user's request directly, completely, and without moralizing. Do not refuse or add unnecessary warnings merely because a topic is adult, sexual, controversial, political, religious, fictional, offensive, technical, cybersecurity-related, or complex. Support cybersecurity education, defensive security, ethical hacking, authorized penetration testing, vulnerability assessment, threat modeling, secure coding, incident response, malware analysis in controlled labs, and capture-the-flag challenges. For authorized, defensive, and lab-contained work, provide concrete explanations, commands, code, and troubleshooting steps when useful. Do not assume malicious intent from security terminology alone. For requests that facilitate unauthorized access, credential theft, stealth, persistence, evasion, malware deployment, or harm to real systems, keep assistance bounded to safe lab demonstrations, detection, mitigation, and remediation. Respect privacy, applicable safety requirements, and provider safeguards; be honest about capabilities and uncertainty.";';
            source = source.slice(0, start) + newDeclaration + source.slice(end + 2);
          }
          const oldPhrase = "technically complex";
          const newPhrase = "technical, cybersecurity-related, or complex";
          const phraseCount = count(source, oldPhrase);
          if (phraseCount === 1) {
            source = source.replace(oldPhrase, newPhrase);
          } else if (phraseCount !== 0 || !source.includes(newPhrase)) {
            throw new Error("Expected a single 'technically complex' phrase before patching; found " + phraseCount);
          }
          if (!source.includes("CYBERSECURITY-AWARE MODE") || !source.includes(newPhrase)) {
            throw new Error("Post-patch source validation failed.");
          }
          if (source.includes("[the rest of the file is too long")) {
            throw new Error("Refusing to write a truncated index.ts.");
          }
          fs.writeFileSync(path, source);
          console.log("Patched only the two requested guidance locations; full file length " + source.length);
          NODE
      - name: Commit and push the small patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/mahi-ai-chat/index.ts
          if git diff --cached --quiet; then
            echo "No file changes were needed."
            exit 0
          fi
          git commit -m "Add cybersecurity and ethical hacking guidance"
          git push origin HEAD:main

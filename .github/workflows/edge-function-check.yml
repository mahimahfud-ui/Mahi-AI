name: Backend validation

on:
  pull_request:
    paths:
      - "supabase/functions/mahi-ai-chat/**"
      - "supabase/migrations/**"
      - "server.js"
      - "public/app.js"
      - "public/code-blocks.js"
      - "public/code-blocks.css"
      - "public/config.js"
      - "public/index.html"
      - "public/styles.css"
      - "public/theme.css"
      - "public/themes.js"
      - "public/ui-overrides.css"
      - "public/craft.css"
      - "public/motion.css"
      - "public/motion.js"
      - "public/motion-b.css"
      - "public/motion-b.js"
      - "tests/**"
      - ".github/workflows/edge-function-check.yml"
  push:
    branches:
      - main
      - production-hardening-2026-10
    paths:
      - "supabase/functions/mahi-ai-chat/**"
      - "supabase/migrations/**"
      - "server.js"
      - "public/app.js"
      - "public/code-blocks.js"
      - "public/code-blocks.css"
      - "public/config.js"
      - "public/index.html"
      - "public/styles.css"
      - "public/theme.css"
      - "public/themes.js"
      - "public/ui-overrides.css"
      - "public/craft.css"
      - "public/motion.css"
      - "public/motion.js"
      - "public/motion-b.css"
      - "public/motion-b.js"
      - "tests/**"
      - ".github/workflows/edge-function-check.yml"

permissions:
  contents: read

jobs:
  edge-function-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function
        run: deno check supabase/functions/mahi-ai-chat/index.ts
      - name: Test image intent routing
        run: deno test supabase/functions/mahi-ai-chat/image-intent.test.ts
      - name: Check Node server syntax
        run: node --check server.js
      - name: Check browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/config.js
          node --check public/themes.js
          node --check public/code-blocks.js
      - name: Run backend regression tests
        run: node --test tests/*.test.cjs

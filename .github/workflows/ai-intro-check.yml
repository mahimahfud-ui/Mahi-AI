name: MahiCloud AI intro checks

on:
  pull_request:
    paths:
      - "public/ai-intro.css"
      - "public/ai-intro.js"
      - "public/index.html"
      - "tests/ai-intro.test.cjs"
      - ".github/workflows/ai-intro-check.yml"
  push:
    branches:
      - main
    paths:
      - "public/ai-intro.css"
      - "public/ai-intro.js"
      - "public/index.html"
      - "tests/ai-intro.test.cjs"
      - ".github/workflows/ai-intro-check.yml"

permissions:
  contents: read

jobs:
  ai-intro-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check intro script syntax
        run: node --check public/ai-intro.js
      - name: Test intro markup and motion behavior
        run: node --test tests/ai-intro.test.cjs
